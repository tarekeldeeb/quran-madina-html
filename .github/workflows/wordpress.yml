# The WordPress plugin (wordpress/quran-madina-html): builds it with its copy of the library
# (wordpress/build.sh), runs it in a real WordPress (SQLite, PHP's built-in server) and checks the
# shortcode, the block and the settings, and runs WordPress.org's Plugin Check on the zip's
# contents. On a release tag, attaches the plugin zip to the GitHub release:
#   https://github.com/tarekeldeeb/quran-madina-html/releases/latest/download/quran-madina-html-wordpress.zip
name: WordPress

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
    paths: ["wordpress/**", "src/**", "assets/**", "Gruntfile.js", ".github/workflows/wordpress.yml"]
  pull_request:
    paths: ["wordpress/**", "src/**", "assets/**", "Gruntfile.js", ".github/workflows/wordpress.yml"]
  workflow_dispatch:

permissions:
  contents: write   # upload the zip to the release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the plugin
        run: |
          npm ci
          npm run build
          wordpress/build.sh --zip "$RUNNER_TEMP/quran-madina-html-wordpress.zip"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, phar, zlib, mbstring, curl

      - name: Lint
        run: for f in $(find wordpress -name '*.php'); do php -l "$f" >/dev/null || exit 1; done

      - name: Run in WordPress
        run: wordpress/quran-madina-html/tests/run.sh "$RUNNER_TEMP/wp"

  # WordPress.org's own checks (the ones its plugin review runs), on what the zip contains.
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the plugin
        run: |
          npm ci
          npm run build
          wordpress/build.sh --zip "$RUNNER_TEMP/quran-madina-html-wordpress.zip"

      - name: Unzip
        run: unzip -q "$RUNNER_TEMP/quran-madina-html-wordpress.zip" -d "$RUNNER_TEMP/plugin"

      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/plugin/quran-madina-html

  package:
    needs: [test, plugin-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the plugin
        run: |
          npm ci
          npm run build
          wordpress/build.sh --zip "$RUNNER_TEMP/quran-madina-html-wordpress.zip"

      # The release workflow creates the GitHub release just after pushing the tag.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/quran-madina-html-wordpress.zip" --clobber
