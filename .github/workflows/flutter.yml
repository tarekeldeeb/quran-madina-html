# The Flutter wrapper (flutter/): analyze, test, and check it would publish to pub.dev.
name: Flutter

on:
  push:
    paths: ["flutter/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["flutter/**", ".github/workflows/flutter.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Its findings also go to an annotation, so they show on the PR without opening the log.
      - name: Publish dry run
        shell: bash
        run: |
          set +e
          flutter pub publish --dry-run > dry-run.txt 2>&1
          code=$?
          cat dry-run.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -v '^\s*[├└│|]' dry-run.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=pub publish --dry-run::$msg"
          fi
          rm -f dry-run.txt
          exit $code
