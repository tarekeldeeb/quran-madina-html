# Release from anywhere (a phone included): GitHub -> Actions -> Release -> Run workflow.
#
# Runs the same `npm run release` (release-it) as a local release: builds dist (scripts/build.mjs), bumps the
# version (the wrappers follow in lockstep), commits + tags on main, creates the GitHub
# release, publishes quran-madina-html and then @tarekeldeeb/quran-madina-react to npm.
#
# Needs one repository secret, NPM_TOKEN: an npm access token allowed to publish both packages
# (granular token with read+write on them; "bypass 2FA" if the account requires 2FA to publish).
#
# Optional secret RELEASE_PAT: a fine-grained GitHub token for this repository with Contents
# read+write. With it, the release tag push starts "Publish Flutter package" (flutter-publish.yml),
# which uploads the Flutter wrapper to pub.dev. Without it the tag is pushed with GITHUB_TOKEN,
# which starts no workflows, and pub.dev must be published by hand.
name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Dry run (show what would happen, publish nothing)"
        type: boolean
        default: true
      wrapper_only:
        description: "Only publish the npm wrappers (React, React Native) at the current version, no bump: e.g. after a staged core publish or a failed wrapper"
        type: boolean
        default: false

permissions:
  contents: write   # release commit, tag and GitHub release

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # release-it reads the tags for the changelog
          # pushes made with RELEASE_PAT start other workflows (the pub.dev publish on the tag)
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # release-it 21 needs Node 22.22.2+
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check the npm token
        if: ${{ !inputs.dry_run }}
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        if: ${{ !inputs.wrapper_only }}
        run: npm run release -- ${{ inputs.increment }} --ci ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # the wrapper waits for the core version to show on npm: 2.0.0 took several minutes
          WRAPPER_PUBLISH_RETRIES: ${{ inputs.dry_run && '1' || '60' }}
          WRAPPER_PUBLISH_DELAY_MS: "10000"

      - name: Publish the npm wrappers only
        if: ${{ inputs.wrapper_only && !inputs.dry_run }}
        run: node scripts/publish-wrapper.mjs "$(node -p "require('./package.json').version")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
