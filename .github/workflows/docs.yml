# Builds the documentation site (docs/, mkdocs.yml) and the landing page (README.md rendered by
# scripts/readme_page.py) and publishes them to GitHub Pages:
#   https://tarekeldeeb.github.io/quran-madina-html/        the README
#   https://tarekeldeeb.github.io/quran-madina-html/docs/   the docs
#   https://tarekeldeeb.github.io/quran-madina-html/reader/ the reader (reader/, as is)
# Only index.html at the root and the docs/ and reader/ folders change; the demo and the Flutter
# example stay.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "overrides/**", "README.md", "scripts/readme_page.py",
            "reader/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "overrides/**", "README.md", "scripts/readme_page.py",
            "reader/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages

concurrency: docs

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # MkDocs 2.0 drops the plugin and theme system Material relies on, so stay on 1.x.
      - name: Install
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10"

      - name: Build
        run: |
          mkdocs build --strict
          python scripts/readme_page.py site-root/index.html

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish
        if: github.event_name != 'pull_request'
        working-directory: gh-pages
        run: |
          rm -rf docs reader
          cp -r ../site docs
          cp -r ../reader reader
          cp ../site-root/index.html index.html
          git add -A -f docs reader index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Docs and landing page from ${GITHUB_SHA}"
          # another workflow may have pushed to gh-pages meanwhile: rebase onto it and retry
          for attempt in 1 2 3 4 5; do
            git push -q origin HEAD:gh-pages && exit 0
            sleep $((attempt * 5))
            git pull -q --rebase origin gh-pages
          done
          exit 1
