name: quran_madina_flutter_example
description: Example app for the quran_madina_flutter package.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  quran_madina_flutter:
    path: ../
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^5.0.0

# Written by `dart run quran_madina_flutter:bundle` (1441H layout), for the offline switch.
flutter:
  assets:
    - assets/quran_madina/assets/db/v2/
    - assets/quran_madina/assets/db/v2/Madina-1441H/
    - assets/quran_madina/assets/img/
    - assets/quran_madina/dist/
